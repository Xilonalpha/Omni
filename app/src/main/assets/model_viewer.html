<!DOCTYPE html>
<html>
<head>
    <title>Omniscient Model Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000000; overflow: hidden; }
        model-viewer { 
            width: 100%; 
            height: 100%; 
            background-color: #000000;
            --poster-color: transparent;
            --instability-level: 0; /* 0 to 1 */
        }

        .unstable {
            filter: drop-shadow(0 0 calc(var(--instability-level) * 15px) #FF00FF)
                    hue-rotate(calc(var(--instability-level) * 180deg))
                    contrast(calc(1 + var(--instability-level)));
        }

        #hud {
            position: absolute;
            top: 10px;
            right: 10px;
            color: #00FFFF;
            font-family: monospace;
            font-size: 10px;
            pointer-events: none;
            text-align: right;
            text-shadow: 0 0 5px #00FFFF;
        }
    </style>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
</head>
<body>
    <model-viewer id="viewer" camera-controls interaction-prompt="auto" shadow-intensity="1" exposure="1" environment-image="neutral" class="unstable"></model-viewer>
    <div id="hud">SYSTEM: SCI-OS v2.0<br>STABILITY: 100%</div>

    <script>
        const modelViewer = document.querySelector('#viewer');
        const hud = document.querySelector('#hud');

        function loadModelFromBase64(base64Data) {
            const byteCharacters = atob(base64Data);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) byteNumbers[i] = byteCharacters.charCodeAt(i);
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray], {type: 'model/gltf-binary'});
            modelViewer.src = URL.createObjectURL(blob);
        }

        function setInstabilityLevel(level) {
            const invLevel = (1.0 - level).toFixed(2);
            modelViewer.style.setProperty('--instability-level', invLevel);
            hud.innerHTML = `SYSTEM: SCI-OS v2.0<br>STABILITY: ${(level * 100).toFixed(0)}%<br>MOD: NEURAL_SYNC`;
        }

        window.addEventListener('load', () => {
            if (window.Android && window.Android.getModelData) {
                const data = window.Android.getModelData();
                if (data) loadModelFromBase64(data);
            }
        });
    </script>
</body>
</html>
